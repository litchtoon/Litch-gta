<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوصول المقيد</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');

  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dark: #8a6820;
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --text: #e8e0d0;
    --muted: #6b6478;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 460px;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(201,168,76,0.1),
      0 40px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(201,168,76,0.15);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .lock-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 18px;
    font-size: 28px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.3); }
    50% { box-shadow: 0 0 0 12px rgba(201,168,76,0); }
  }

  .title {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    margin-bottom: 36px;
    line-height: 1.7;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    opacity: 0.3;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px;
    background: var(--gold);
  }
  .divider span { font-size: 12px; color: var(--gold); }

  input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    font-family: 'Tajawal', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    letter-spacing: 4px;
    transition: all 0.3s;
    outline: none;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  input[type="text"]:focus {
    border-color: rgba(201,168,76,0.5);
    background: rgba(201,168,76,0.04);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
  }

  input.shake {
    animation: shake 0.4s ease;
    border-color: #e05555 !important;
    box-shadow: 0 0 0 3px rgba(224,85,85,0.15) !important;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .btn-check {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
    color: #1a1200;
    font-family: 'Tajawal', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .btn-check:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-check::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: 0.4s;
  }
  .btn-check:hover:not(:disabled)::after { transform: translateX(100%); }
  .btn-check:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(201,168,76,0.4); }
  .btn-check:active:not(:disabled) { transform: translateY(0); }

  .msg {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    display: none;
  }
  .msg.error {
    display: block;
    background: rgba(224,85,85,0.1);
    border: 1px solid rgba(224,85,85,0.3);
    color: #e08080;
  }
  .msg.used {
    display: block;
    background: rgba(200,130,40,0.1);
    border: 1px solid rgba(200,130,40,0.3);
    color: #d4a050;
  }

  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.5;
  }

  #successScreen, #alreadyScreen {
    display: none;
    text-align: center;
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .big-icon {
    font-size: 60px;
    margin-bottom: 20px;
    animation: pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
  }

  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .screen-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--gold-light);
    margin-bottom: 6px;
  }

  .screen-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
    line-height: 1.7;
  }

  .btn-play {
    display: inline-block;
    padding: 20px 50px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
    color: #1a1200;
    border: none;
    border-radius: 18px;
    font-family: 'Tajawal', sans-serif;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    box-shadow: 0 8px 30px rgba(201,168,76,0.4);
    position: relative;
    overflow: hidden;
  }

  .btn-play::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: 0.4s;
  }
  .btn-play:hover::after { transform: translateX(100%); }
  .btn-play:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(201,168,76,0.55); }
  .btn-play:active { transform: translateY(0); }

  .loading {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid #1a1200;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="card">

    <!-- شاشة إدخال الكود -->
    <div id="loginScreen">
      <div class="lock-icon">🔐</div>
      <div class="title">منطقة مقيدة</div>
      <div class="subtitle">أدخل كودك الخاص للوصول<br>كل كود صالح لشخص واحد فقط</div>
      <div class="divider"><span>✦</span></div>

      <input type="text" id="codeInput" placeholder="أدخل الكود هنا" maxlength="20" autocomplete="off" spellcheck="false" />
      <button class="btn-check" id="checkBtn" onclick="checkCode()">🔓 تحقق من الكود</button>

      <div class="msg error" id="errorMsg">❌ الكود غير صحيح، حاول مجدداً</div>
      <div class="msg used"  id="usedMsg">🚫 هذا الكود مستخدم بالفعل من شخص آخر</div>

      <div class="footer">كل كود صالح لشخص واحد فقط</div>
    </div>

    <!-- شاشة النجاح (أول مرة) -->
    <div id="successScreen">
      <div class="big-icon">✅</div>
      <div class="screen-title">تم التحقق بنجاح!</div>
      <div class="screen-sub">كودك محفوظ — يمكنك الدخول دائماً</div>
      <button class="btn-play" onclick="goToSite()">🎮 اضغط للعب</button>
    </div>

    <!-- شاشة العودة (نفس الشخص) -->
    <div id="alreadyScreen">
      <div class="big-icon">👋</div>
      <div class="screen-title">أهلاً بعودتك!</div>
      <div class="screen-sub">كودك مسجّل<br>تفضل بالدخول مباشرة</div>
      <button class="btn-play" onclick="goToSite()">🎮 اضغط للعب</button>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://qwnfnraniogioixjwigo.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bmZucmFuaW9naW9peGp3aWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTAyMDYsImV4cCI6MjA5MzIyNjIwNn0.e6qgdMj05i0z0IG_Lg8JzDx2-OdV698kiWZrSiK0LWs";
  const TARGET = "https://quenq.com/apps/vice-city/";

  const VALID_CODES = [
    "VIPER9X","GHOST4K","TITAN7Z","RAVEN2M","STORM6Q",
    "BLADE3W","NEXUS8Y","COBRA5J","DELTA1F","PHOENIX0",
    "ZEPHYR4","FALCON7","OBSIDIAN","CIPHER3X","AURORA2K",
    "MIRAGE9","VENOM5Q","ECLIPSE1","SHADOW8W","STEALTH6"
  ];

  const MY_KEY = "vc_myCode_v2";

  function getDeviceId() {
    let id = localStorage.getItem("vc_did");
    if (!id) {
      id = "D" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      localStorage.setItem("vc_did", id);
    }
    return id;
  }

  function goToSite() {
    window.location.href = TARGET;
  }

  function show(id) {
    ["loginScreen","successScreen","alreadyScreen"].forEach(s =>
      document.getElementById(s).style.display = s === id ? "block" : "none"
    );
  }

  function shake(el) {
    el.classList.add("shake");
    setTimeout(() => el.classList.remove("shake"), 400);
  }

  function setLoading(on) {
    const btn = document.getElementById("checkBtn");
    btn.disabled = on;
    btn.innerHTML = on
      ? 'جاري التحقق <span class="loading"></span>'
      : '🔓 تحقق من الكود';
  }

  // عند تحميل الصفحة — هل عنده كود محفوظ؟
  window.onload = function() {
    const myCode = localStorage.getItem(MY_KEY);
    if (myCode) {
      show("alreadyScreen");
    }
  };

  async function checkCode() {
    const input = document.getElementById("codeInput");
    const code  = input.value.trim().toUpperCase();
    document.getElementById("errorMsg").style.display = "none";
    document.getElementById("usedMsg").style.display  = "none";
    input.classList.remove("shake");

    if (!code) { shake(input); return; }

    // كود غلط
    if (!VALID_CODES.includes(code)) {
      shake(input);
      document.getElementById("errorMsg").style.display = "block";
      return;
    }

    setLoading(true);

    try {
      const deviceId = getDeviceId();

      // اتحقق من الكود في Supabase
      const res = await fetch(`${SUPABASE_URL}/rest/v1/codes?code=eq.${code}`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });

      const data = await res.json();

      if (data.length === 0) {
        // الكود لم يُستخدم بعد — سجّله
        await fetch(`${SUPABASE_URL}/rest/v1/codes`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code: code, device_id: deviceId })
        });

        localStorage.setItem(MY_KEY, code);
        setLoading(false);
        show("successScreen");

      } else if (data[0].device_id === deviceId) {
        // نفس الجهاز — ادخل
        localStorage.setItem(MY_KEY, code);
        setLoading(false);
        show("alreadyScreen");

      } else {
        // جهاز تاني استخدمه
        setLoading(false);
        shake(input);
        document.getElementById("usedMsg").style.display = "block";
      }

    } catch (e) {
      setLoading(false);
      document.getElementById("errorMsg").style.display = "block";
      document.getElementById("errorMsg").textContent = "⚠️ خطأ في الاتصال، حاول مجدداً";
    }
  }

  document.getElementById("codeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") checkCode();
  });
</script>
</body>
</html>
